<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- Minecraft Diamond Sword Pointer Cursor -->
  <!-- Subtle Drop Shadow -->
  <g fill="rgba(0,0,0,0.35)" transform="translate(1, 1)">
    <rect x="2" y="2" width="2" height="2"/>
    <rect x="2" y="4" width="4" height="2"/>
    <rect x="4" y="4" width="4" height="4"/>
    <rect x="6" y="6" width="4" height="4"/>
    <rect x="8" y="8" width="4" height="4"/>
    <rect x="10" y="10" width="4" height="4"/>
    <rect x="12" y="12" width="6" height="4"/>
    <rect x="12" y="14" width="4" height="6"/>
    <rect x="16" y="16" width="4" height="4"/>
    <rect x="18" y="18" width="4" height="4"/>
  </g>

  <!-- Sword Blade Outline (Dark Cyan / Black) -->
  <g fill="#0b2828">
    <rect x="1" y="1" width="3" height="3"/>
    <rect x="3" y="1" width="3" height="2"/>
    <rect x="1" y="3" width="2" height="3"/>
    <rect x="4" y="2" width="3" height="2"/>
    <rect x="2" y="4" width="2" height="3"/>
    <rect x="6" y="4" width="3" height="2"/>
    <rect x="4" y="6" width="2" height="3"/>
    <rect x="8" y="6" width="3" height="2"/>
    <rect x="6" y="8" width="2" height="3"/>
    <rect x="10" y="8" width="3" height="2"/>
    <rect x="8" y="10" width="2" height="3"/>
    <rect x="12" y="10" width="3" height="2"/>
    <rect x="10" y="12" width="2" height="3"/>
  </g>

  <!-- Diamond Blade Core (Cyan & Highlights) -->
  <g fill="#2de2e6">
    <rect x="2" y="2" width="2" height="2"/>
    <rect x="3" y="3" width="3" height="3"/>
    <rect x="5" y="5" width="3" height="3"/>
    <rect x="7" y="7" width="3" height="3"/>
    <rect x="9" y="9" width="3" height="3"/>
    <rect x="11" y="11" width="3" height="3"/>
  </g>

  <!-- Diamond Blade Gleam (White / Pale Cyan) -->
  <g fill="#ffffff">
    <rect x="2" y="2" width="1" height="1"/>
    <rect x="3" y="3" width="1" height="2"/>
    <rect x="5" y="5" width="1" height="2"/>
    <rect x="7" y="7" width="1" height="2"/>
    <rect x="9" y="9" width="1" height="2"/>
  </g>

  <!-- Diamond Blade Shading (Darker Teal) -->
  <g fill="#0ea5a5">
    <rect x="4" y="5" width="2" height="1"/>
    <rect x="6" y="7" width="2" height="1"/>
    <rect x="8" y="9" width="2" height="1"/>
    <rect x="10" y="11" width="2" height="1"/>
    <rect x="12" y="13" width="2" height="1"/>
  </g>

  <!-- Guard (Gold / Wood) -->
  <g fill="#2b1a0d">
    <!-- Guard outline -->
    <rect x="8" y="14" width="6" height="2"/>
    <rect x="14" y="8" width="2" height="6"/>
    <rect x="13" y="13" width="3" height="3"/>
  </g>
  <g fill="#5c3818">
    <rect x="9" y="14" width="4" height="2"/>
    <rect x="14" y="9" width="2" height="4"/>
  </g>

  <!-- Handle / Grip (Oak Wood) -->
  <rect x="14" y="14" width="3" height="3" fill="#8b572a"/>
  <rect x="15" y="15" width="3" height="3" fill="#5c3818"/>
  <rect x="17" y="17" width="3" height="3" fill="#2b1a0d"/>

  <!-- Pommel (Diamond Cap) -->
  <rect x="18" y="18" width="3" height="3" fill="#2de2e6"/>
  <rect x="19" y="19" width="1" height="1" fill="#ffffff"/>
  <rect x="20" y="20" width="2" height="2" fill="#0b2828"/>
</svg>

