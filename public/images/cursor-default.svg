<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22" shape-rendering="crispEdges">
  <!-- Minecraft Classic GUI Cursor Pointer -->
  <!-- Shadow -->
  <g fill="rgba(0,0,0,0.4)" transform="translate(1, 1)">
    <rect x="0" y="0" width="2" height="2"/>
    <rect x="0" y="2" width="4" height="2"/>
    <rect x="0" y="4" width="6" height="2"/>
    <rect x="0" y="6" width="8" height="2"/>
    <rect x="0" y="8" width="10" height="2"/>
    <rect x="0" y="10" width="12" height="2"/>
    <rect x="0" y="12" width="14" height="2"/>
    <rect x="0" y="14" width="16" height="2"/>
    <rect x="0" y="16" width="18" height="2"/>
    <rect x="0" y="18" width="14" height="2"/>
    <rect x="8" y="20" width="6" height="2"/>
  </g>

  <!-- Black Outline -->
  <!-- Col 0 -->
  <rect x="0" y="0" width="2" height="18" fill="#000000"/>
  <!-- Diagonals & Edges -->
  <rect x="2" y="18" width="2" height="2" fill="#000000"/>
  <rect x="4" y="16" width="2" height="2" fill="#000000"/>
  <rect x="6" y="14" width="2" height="2" fill="#000000"/>
  <rect x="6" y="16" width="2" height="4" fill="#000000"/>
  <rect x="8" y="18" width="2" height="4" fill="#000000"/>
  <rect x="10" y="18" width="2" height="4" fill="#000000"/>
  <rect x="12" y="16" width="2" height="4" fill="#000000"/>
  <rect x="10" y="14" width="6" height="2" fill="#000000"/>
  <rect x="14" y="12" width="2" height="2" fill="#000000"/>
  <rect x="12" y="10" width="2" height="2" fill="#000000"/>
  <rect x="10" y="8" width="2" height="2" fill="#000000"/>
  <rect x="8" y="6" width="2" height="2" fill="#000000"/>
  <rect x="6" y="4" width="2" height="2" fill="#000000"/>
  <rect x="4" y="2" width="2" height="2" fill="#000000"/>
  <rect x="2" y="0" width="2" height="2" fill="#000000"/>

  <!-- White Body -->
  <rect x="2" y="2" width="2" height="16" fill="#ffffff"/>
  <rect x="4" y="4" width="2" height="12" fill="#ffffff"/>
  <rect x="6" y="6" width="2" height="8" fill="#ffffff"/>
  <rect x="8" y="8" width="2" height="6" fill="#ffffff"/>
  <rect x="10" y="10" width="2" height="4" fill="#ffffff"/>
  <rect x="12" y="12" width="2" height="2" fill="#ffffff"/>
  <rect x="8" y="16" width="2" height="2" fill="#ffffff"/>
  <rect x="10" y="16" width="2" height="2" fill="#ffffff"/>

  <!-- Grey Shading (right edge) -->
  <rect x="4" y="14" width="2" height="2" fill="#c0c0c0"/>
  <rect x="6" y="12" width="2" height="2" fill="#c0c0c0"/>
  <rect x="8" y="12" width="2" height="2" fill="#c0c0c0"/>
  <rect x="10" y="12" width="2" height="2" fill="#a0a0a0"/>
  <rect x="10" y="16" width="2" height="2" fill="#a0a0a0"/>
</svg>

