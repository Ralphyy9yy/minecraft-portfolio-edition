<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Steve 8x8 Pixel Art Head (scaled 2x to 16x16) -->
  <!-- Row 0: Hair -->
  <rect x="0" y="0" width="2" height="2" fill="#361f10"/>
  <rect x="2" y="0" width="2" height="2" fill="#361f10"/>
  <rect x="4" y="0" width="2" height="2" fill="#4a2c17"/>
  <rect x="6" y="0" width="2" height="2" fill="#361f10"/>
  <rect x="8" y="0" width="2" height="2" fill="#361f10"/>
  <rect x="10" y="0" width="2" height="2" fill="#4a2c17"/>
  <rect x="12" y="0" width="2" height="2" fill="#361f10"/>
  <rect x="14" y="0" width="2" height="2" fill="#361f10"/>

  <!-- Row 1: Hair -->
  <rect x="0" y="2" width="2" height="2" fill="#361f10"/>
  <rect x="2" y="2" width="2" height="2" fill="#4a2c17"/>
  <rect x="4" y="2" width="2" height="2" fill="#4a2c17"/>
  <rect x="6" y="2" width="2" height="2" fill="#4a2c17"/>
  <rect x="8" y="2" width="2" height="2" fill="#4a2c17"/>
  <rect x="10" y="2" width="2" height="2" fill="#4a2c17"/>
  <rect x="12" y="2" width="2" height="2" fill="#4a2c17"/>
  <rect x="14" y="2" width="2" height="2" fill="#361f10"/>

  <!-- Row 2: Hair & Forehead -->
  <rect x="0" y="4" width="2" height="2" fill="#361f10"/>
  <rect x="2" y="4" width="2" height="2" fill="#4a2c17"/>
  <rect x="4" y="4" width="2" height="2" fill="#c48a62"/>
  <rect x="6" y="4" width="2" height="2" fill="#c48a62"/>
  <rect x="8" y="4" width="2" height="2" fill="#c48a62"/>
  <rect x="10" y="4" width="2" height="2" fill="#c48a62"/>
  <rect x="12" y="4" width="2" height="2" fill="#4a2c17"/>
  <rect x="14" y="4" width="2" height="2" fill="#361f10"/>

  <!-- Row 3: Face / Forehead -->
  <rect x="0" y="6" width="2" height="2" fill="#c48a62"/>
  <rect x="2" y="6" width="2" height="2" fill="#c48a62"/>
  <rect x="4" y="6" width="2" height="2" fill="#d49b73"/>
  <rect x="6" y="6" width="2" height="2" fill="#d49b73"/>
  <rect x="8" y="6" width="2" height="2" fill="#d49b73"/>
  <rect x="10" y="6" width="2" height="2" fill="#c48a62"/>
  <rect x="12" y="6" width="2" height="2" fill="#c48a62"/>
  <rect x="14" y="6" width="2" height="2" fill="#c48a62"/>

  <!-- Row 4: Eyes -->
  <rect x="0" y="8" width="2" height="2" fill="#c48a62"/>
  <rect x="2" y="8" width="2" height="2" fill="#ffffff"/>
  <rect x="4" y="8" width="2" height="2" fill="#2d338f"/>
  <rect x="6" y="8" width="2" height="2" fill="#b87b54"/>
  <rect x="8" y="8" width="2" height="2" fill="#b87b54"/>
  <rect x="10" y="8" width="2" height="2" fill="#2d338f"/>
  <rect x="12" y="8" width="2" height="2" fill="#ffffff"/>
  <rect x="14" y="8" width="2" height="2" fill="#c48a62"/>

  <!-- Row 5: Nose & Cheeks -->
  <rect x="0" y="10" width="2" height="2" fill="#b87b54"/>
  <rect x="2" y="10" width="2" height="2" fill="#c48a62"/>
  <rect x="4" y="10" width="2" height="2" fill="#b87b54"/>
  <rect x="6" y="10" width="2" height="2" fill="#995f3b"/>
  <rect x="8" y="10" width="2" height="2" fill="#995f3b"/>
  <rect x="10" y="10" width="2" height="2" fill="#b87b54"/>
  <rect x="12" y="10" width="2" height="2" fill="#c48a62"/>
  <rect x="14" y="10" width="2" height="2" fill="#b87b54"/>

  <!-- Row 6: Mouth / Goatee Top -->
  <rect x="0" y="12" width="2" height="2" fill="#b87b54"/>
  <rect x="2" y="12" width="2" height="2" fill="#b87b54"/>
  <rect x="4" y="12" width="2" height="2" fill="#522f18"/>
  <rect x="6" y="12" width="2" height="2" fill="#522f18"/>
  <rect x="8" y="12" width="2" height="2" fill="#522f18"/>
  <rect x="10" y="12" width="2" height="2" fill="#522f18"/>
  <rect x="12" y="12" width="2" height="2" fill="#b87b54"/>
  <rect x="14" y="12" width="2" height="2" fill="#b87b54"/>

  <!-- Row 7: Beard / Chin -->
  <rect x="0" y="14" width="2" height="2" fill="#995f3b"/>
  <rect x="2" y="14" width="2" height="2" fill="#522f18"/>
  <rect x="4" y="14" width="2" height="2" fill="#522f18"/>
  <rect x="6" y="14" width="2" height="2" fill="#522f18"/>
  <rect x="8" y="14" width="2" height="2" fill="#522f18"/>
  <rect x="10" y="14" width="2" height="2" fill="#522f18"/>
  <rect x="12" y="14" width="2" height="2" fill="#522f18"/>
  <rect x="14" y="14" width="2" height="2" fill="#995f3b"/>
</svg>

